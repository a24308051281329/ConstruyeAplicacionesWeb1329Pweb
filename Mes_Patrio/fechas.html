<!DOCTYPE html> <!-- Indica que el documento utiliza HTML5 -->

<html> <!-- Inicio del documento HTML -->

<head> <!-- Contiene la configuración de la página -->

<!-- Tipos de letra utilizados en la página -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">

<style>

/* ---------- configuración general ---------- */
body {
    margin: 0;
    background-color: #f0eeea;
}


/* ---------- encabezado ---------- */
.mi-encabezado {
    background-color: #036436;

    background-image: 
        url('decoracion/orilla.png'),
        url('decoracion/orilla2.png');

    background-repeat: no-repeat, no-repeat;

    background-position: center top, center bottom;

    background-size: 100% 89%, 100% 55%;

    padding: 5px 20px;
    text-align: center;
    color: #ffffff;
}


/* ---------- título del encabezado ---------- */
.mi-encabezado h1 {
    font-family: "Rye", serif;
    font-weight: 400;
    font-style: normal;
    font-size: 5.2rem;
}


/* ---------- letra Rye ---------- */
.letra-rye {
    font-family: "Rye", serif;
    font-weight: 400;
    font-size: 2.5rem;
    margin-top: 5px;
}


/* ---------- letra Times New Roman ---------- */
.letra-times {
    font-family: "Times New Roman", serif;
    font-weight: 400;
    font-size: 2rem;
    margin-top: 4px;
    text-align: center;
}


/* ---------- menú de navegación ---------- */
nav {
    background-color: #f7f7f7;
    border-bottom: 15px solid #f7f7f7;
    border-top: 10px solid #f7f7f7;
    text-align: center;
    padding: 0;
}


/* ---------- botones del menú ---------- */
nav a {
    display: inline-block;
    background-color: #c8d1d9;
    color: #000000;
    text-decoration: none;
    font-family: Rye, sans-serif;
    font-weight: 400;
    font-size: 1.5rem;
    padding: 10px 60px;
    border-radius: 55px;
    margin: 0 20px;
}


/* ---------- cambio de color al pasar el cursor ---------- */
nav a:hover {
    background-color: #f87778;
    color: #ffffff;
}


/* ---------- calendario ---------- */
.calendario {
    font-family: "Open Sans", sans-serif;
    font-weight: bold;
    max-width: 1000px;
    margin: 30px 0 80px 60px;
}


/* ---------- tabla del calendario ---------- */
table {
    width: 50%;
    table-layout: fixed;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #000000;
    padding: 6px;
    width: 155px;
}

td {
    height: 80px;
    text-align: right;
    vertical-align: top;
}


/* ---------- fechas importantes ---------- */
strong {
    color: #b11a1c;
    display: block;
    text-align: center;
}


/* ---------- línea del tiempo ---------- */
.timeline {
    width: 90%;
    margin: 50px auto;
}

.timeline h2 {
    font-family: "Rye", serif;
    font-size: 2.5rem;
}


/* ---------- pie de página ---------- */
footer {
    position: relative;
    background-color: #b11a1c;
    color: white;
    text-align: center;
    padding: 5px;
    font-family: "Times New Roman", serif;
    font-size: 1.7rem;
}


/* ---------- texto del pie de página ---------- */
footer p {
    margin: 6px;
}


/* ---------- flores decorativas ---------- */
.flor-izquierda {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 110px;
}

.flor-derecha {
    position: absolute;
    bottom: 0;
    right: 0;
    height: 110px;
    transform: rotate(180deg);
}

</style>

</head> <!-- Finaliza la configuración de la página -->


<body> <!-- Inicio del contenido visible -->

</footer>


</body>

</html>
